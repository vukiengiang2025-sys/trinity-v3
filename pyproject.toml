[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "trinity-orchestrator"
version = "3.1.0"
description = "TRINITY v3.1 - Lightweight AI Agent Orchestrator with BRAIN/LOGIC/MUSCLE adapters"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "PyYAML>=6.0,<7.0",
]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Build Tools",
    "Topic :: System :: Systems Administration",
]

[tool.setuptools]
# Chạy trực tiếp: python3 trinity.py
# Có thể cài editable: pip install -e .
py-modules = ["trinity"]

[tool.setuptools.packages.find]
include = ["core*", "adapters*", "storage*"]

[tool.ruff]
line-length = 120
target-version = "py39"
